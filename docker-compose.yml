services:
  server:
    build:
      context: .
      dockerfile: PixelUno.Server/Dockerfile    
    restart: always
    container_name: pixeluno_server
    ports:
      - ${API_BINDING_IP}:${API_PORT}:8080
  tunnel:
    image: cloudflare/cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}